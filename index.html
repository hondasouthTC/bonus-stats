<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B1C20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="獎金統計">
<title>獎金統計</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#F2F0EB; --card:#FFFFFF; --ink:#16181B; --ink2:#5C6169; --ink3:#8A8F97;
  --line:#E4E0D8; --line2:#EDEAE3;
  --red:#C41C12; --red-dk:#8E1109; --green:#0B7A55; --amber:#A9701A; --blue:#1F5FA8;
  --shadow:0 1px 2px rgba(22,24,27,.05), 0 6px 18px -12px rgba(22,24,27,.25);
}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font-family:inherit}
.app{max-width:640px;margin:0 auto;min-height:100vh;background:var(--paper)}

/* ---------- header ---------- */
.hdr{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(180deg,#1F2025 0%,#141519 100%);
  color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;
  border-bottom:2px solid var(--red);
}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.logo{width:26px;height:26px;border-radius:7px;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:none}
.brand h1{font-size:18px;font-weight:700;margin:0;letter-spacing:.02em;white-space:nowrap}
.chip{
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);color:rgba(255,255,255,.7);
  font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:999px;cursor:pointer;flex:none;
  font-variant-numeric:tabular-nums;
}
.hdr-actions{display:flex;gap:6px;flex:none}
.icon-btn{
  width:34px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.07);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.icon-btn:active{background:rgba(255,255,255,.16)}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fld{display:block}
.fld span{display:block;font-size:10.5px;color:rgba(255,255,255,.5);margin-bottom:5px;letter-spacing:.04em}
.fld input,.fld select{
  width:100%;height:40px;border-radius:10px;padding:0 10px;font-size:14px;font-weight:600;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);color:#fff;
  appearance:none;-webkit-appearance:none;
}
.fld select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-opacity='0.55' stroke-width='2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 9px center;background-size:15px;padding-right:30px}
.fld input::placeholder{color:rgba(255,255,255,.35)}
.fld input:focus,.fld select:focus{outline:none;border-color:rgba(196,28,18,.9);background:rgba(255,255,255,.13)}

.tabs{display:flex;background:rgba(255,255,255,.08);border-radius:11px;padding:4px;margin-top:12px;gap:4px}
.tabs button{
  flex:1;height:36px;border:0;border-radius:8px;background:transparent;color:rgba(255,255,255,.62);
  font-size:13px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;
}
.tabs button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{background:#fff;color:#16181B;box-shadow:0 1px 3px rgba(0,0,0,.2)}

/* ---------- main ---------- */
main{padding:14px 16px 96px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.meta{font-size:12.5px;color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-size:15px}
.btn-primary{
  height:38px;padding:0 14px;border:0;border-radius:10px;background:var(--red);color:#fff;
  font-size:13.5px;font-weight:700;letter-spacing:.02em;cursor:pointer;box-shadow:0 2px 8px -2px rgba(196,28,18,.55);
  display:inline-flex;align-items:center;gap:4px;flex:none;
}
.btn-primary:active{background:var(--red-dk)}

/* record card */
.rec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 8px;margin-bottom:10px;box-shadow:var(--shadow)}
.rec-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.rec-model{font-size:15px;font-weight:700;letter-spacing:.01em}
.rec-sub{font-size:12px;color:var(--ink2);margin-top:3px;display:flex;flex-wrap:wrap;gap:0 6px}
.rec-sub i{font-style:normal;color:var(--ink3)}
.pill{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:#F0EEE8;color:#565B62;flex:none;letter-spacing:.02em}
.pill[data-s="已交"]{background:#E3F1EA;color:var(--green)}
.pill[data-s="已領"]{background:#E6EEF9;color:var(--blue)}
.pill[data-s="已配"]{background:#FBF0DC;color:var(--amber)}
.pill[data-s="訂車"]{background:#EDEBE4;color:#5C6169}
.rec-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:11px;padding-top:10px;border-top:1px dashed var(--line2)}
.n-hd{display:block;font-size:10.5px;color:var(--ink3);margin-bottom:1px}
.n-v{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.n-v.pos{color:var(--green)} .n-v.neg{color:var(--red)}
.n-v.bonus{color:var(--blue)} .n-v.spend{color:var(--red)}
.kv dd.b{color:var(--blue)} .kv dd.r{color:var(--red)}
.tags{display:inline-flex;gap:4px;margin-left:6px;vertical-align:2px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:700;letter-spacing:.02em;
  padding:2px 6px;border-radius:5px;border:1px solid;line-height:1.35;white-space:nowrap}
.tag.loan{color:#1F5FA8;border-color:#C5D9F0;background:#EAF2FB}
.tag.ins{color:#0B7A55;border-color:#BFE3D2;background:#E7F4EE}
.subrow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:700;
  margin:8px 0 0;padding:7px 10px;border-radius:8px;background:#F4F7FB;border:1px dashed #C5D9F0}
.subrow span{color:#1F5FA8;letter-spacing:.02em}
.subrow b{color:var(--blue);font-variant-numeric:tabular-nums}
.subnote{font-size:10px;color:var(--ink3);margin:4px 1px 0;letter-spacing:.01em}
.dhead{font-size:10.5px;font-weight:700;letter-spacing:.08em;margin:10px 0 3px;display:flex;align-items:center;gap:6px}
.dhead.chip{color:var(--blue)} .dhead.out{color:var(--red);margin-top:12px}
.dhead:before{content:'';width:3px;height:9px;border-radius:2px;background:currentColor;display:block}
.rec-tail{display:flex;align-items:center;justify-content:space-between;margin-top:2px;padding-top:0;border-top:0;min-height:22px}
.rec-tail .t{font-size:10.5px;color:var(--ink3);margin-right:auto}
.tgl{background:none;border:0;color:var(--red);font-size:11px;font-weight:700;padding:3px 0 3px 6px;cursor:pointer;display:flex;align-items:center;gap:3px}
.tgl svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;transition:transform .18s}
.rec.open .tgl svg{transform:rotate(180deg)}
.rec-body{display:none;margin-top:9px;padding-top:6px;border-top:1px dashed var(--line2)}
.rec.open .rec-body{display:block}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:12px;padding:3px 0}
.kv dt{color:var(--ink2)} .kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.rec-acts{display:flex;gap:8px;margin-top:10px}
.rec-acts button{flex:1;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.rec-acts button.del{color:var(--red);border-color:#F0D3D0}

/* empty */
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:34px 22px;text-align:center}
.empty .ic{width:44px;height:44px;border-radius:50%;background:#F2EFE9;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.empty .ic svg{width:22px;height:22px;stroke:var(--ink3);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.empty h3{margin:0 0 5px;font-size:14.5px}
.empty p{margin:0 0 16px;font-size:12.5px;color:var(--ink2);line-height:1.6}
.empty .row2{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;font-weight:700;cursor:pointer}
.btn.red{border-color:var(--red);color:var(--red)}

/* summary */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi > span{display:block;font-size:11px;color:var(--ink3);margin-bottom:3px;letter-spacing:.03em}
.kpi > span:first-child{margin-bottom:3px}
.kpi b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi b.pos{color:var(--green)} .kpi b.neg{color:var(--red)}
.kpi.wide{grid-column:span 2;display:flex;align-items:center;justify-content:space-between;gap:10px}
.kpi.wide .sub{font-size:11.5px;color:var(--ink2);text-align:right;line-height:1.5}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;box-shadow:var(--shadow)}
.sec h2{font-size:12px;font-weight:700;margin:0 0 12px;color:#3A3E45;letter-spacing:.06em}
.brow{display:grid;grid-template-columns:74px 1fr 62px;align-items:center;gap:9px;margin-bottom:9px;font-size:12px}
.brow:last-child{margin-bottom:0}
.brow .lb{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .tr{height:8px;border-radius:4px;background:#F0EEE8;overflow:hidden}
.brow .tr i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#D8231A,#8E1109)}
.brow .vl{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.brow.a .tr i{background:linear-gradient(90deg,#2E9C74,#0B7A55)}
.mrow{display:flex;align-items:flex-end;gap:6px;height:104px;padding-top:6px}
.mcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
.mcol .b{width:100%;max-width:34px;border-radius:4px 4px 2px 2px;background:#DDD8CE;min-height:3px;transition:background .15s}
.mcol.on .b{background:linear-gradient(180deg,#D8231A,#8E1109)}
.mcol .t{font-size:9.5px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}
.mcol.on .t{color:var(--red);font-weight:700}
.legend{display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--ink2)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:1px}

/* sheet / form */
.sheet{position:fixed;inset:0;z-index:80;background:#F7F5F1;display:flex;flex-direction:column;animation:up .22s ease}
@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
.sheet[hidden]{display:none}
.sheet-hd{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:#fff;border-bottom:1px solid var(--line);
}
.sheet-hd strong{font-size:15px;letter-spacing:.02em}
.sheet-hd .t1{background:none;border:0;color:var(--ink2);font-size:14px;font-weight:600;padding:6px;cursor:pointer}
.sheet-hd .t2{background:var(--red);border:0;color:#fff;font-size:13.5px;font-weight:700;padding:8px 16px;border-radius:9px;cursor:pointer}
.sheet-body{flex:1;overflow-y:auto;padding:12px 14px 120px;-webkit-overflow-scrolling:touch}
.grp{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.grp-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#FBFAF7;border-bottom:1px solid var(--line)}
.grp-hd span{font-size:12px;font-weight:700;color:#3A3E45;letter-spacing:.05em}
.grp-hd em{font-style:normal;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2)}
.grp-bd{padding:2px 14px 10px}
.row{display:grid;grid-template-columns:1fr 122px;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line2)}
.row:last-child{border-bottom:0}
.row label{font-size:13px;color:#3A3E45}
.row.stack{grid-template-columns:1fr;gap:5px;border-bottom:0;padding:6px 0}
.row.stack label{font-size:11.5px;color:var(--ink3)}
input.money,input.txt,select.sel{
  width:100%;height:37px;border:1px solid var(--line);border-radius:9px;padding:0 9px;font-size:14px;
  background:#FDFCFA;color:var(--ink);
}
input.money{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
input.txt{font-weight:600}
select.sel{appearance:none;-webkit-appearance:none;font-weight:600;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238A8F97' stroke-width='2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 8px center;background-size:15px;padding-right:28px}
input:focus,select:focus{outline:none;border-color:var(--red);background:#fff;box-shadow:0 0 0 3px rgba(196,28,18,.1)}
.pair{display:grid;grid-template-columns:1fr 108px;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line2)}
.pair:last-child{border-bottom:0}
.pair input{height:36px}
.flags{display:flex;gap:8px;padding:8px 0 4px;flex-wrap:wrap}
.flag{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink2);border:1px solid var(--line);border-radius:9px;padding:8px 11px;cursor:pointer;background:#FDFCFA}
.flag input{width:15px;height:15px;accent-color:var(--red);margin:0}
.flag.on{border-color:var(--red);color:var(--red);background:#FFF6F5}
.sheet-ft{
  position:absolute;left:0;right:0;bottom:0;background:#1B1C20;color:#fff;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;
}
.sheet-ft div{flex:1;font-size:10.5px;color:rgba(255,255,255,.55);letter-spacing:.03em}
.sheet-ft div b{display:block;font-size:15px;color:#fff;font-variant-numeric:tabular-nums;margin-top:1px;letter-spacing:-.01em}
.sheet-ft div.big b{font-size:17px;color:#5FD3A3}
.sheet-ft div.big.neg b{color:#FF8A80}
.note{font-size:11.5px;color:var(--ink3);line-height:1.6;padding:2px 4px 0}

.toast{
  position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,12px);
  background:rgba(24,25,28,.94);color:#fff;font-size:12.5px;font-weight:600;padding:10px 16px;border-radius:10px;
  z-index:200;opacity:0;pointer-events:none;transition:.22s;white-space:nowrap;max-width:88vw;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div class="hdr-top">
      <div class="brand">
        <span class="logo">獎</span>
        <h1>獎金統計</h1>
        <button class="chip" id="verChip">v1.0.0</button>
      </div>
      <div class="hdr-actions">
        <button class="icon-btn" id="btnData" title="資料匯入／匯出">
          <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        </button>
      </div>
    </div>
    <div class="filters">
      <label class="fld"><span>業務員</span><input id="staff" list="staffList" placeholder="輸入姓名" autocomplete="off"><datalist id="staffList"></datalist></label>
      <label class="fld"><span>月份</span><select id="month"></select></label>
    </div>
    <nav class="tabs" id="tabs">
      <button data-view="detail" class="on">
        <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>
        車輛明細
      </button>
      <button data-view="summary">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        月結總覽
      </button>
    </nav>
  </header>

  <main>
    <section id="viewDetail">
      <div class="toolbar">
        <div class="meta" id="listMeta"></div>
        <button class="btn-primary" id="btnAdd">＋ 新增車輛</button>
      </div>
      <div id="list" class="list"></div>
    </section>

    <section id="viewSummary" class="hide">
      <div class="kpis" id="kpis"></div>
      <div class="sec" id="secModel"></div>
      <div class="sec" id="secStatus"></div>
      <div class="sec" id="secTrend"></div>
    </section>
  </main>
</div>

<div class="sheet" id="sheet" hidden>
  <header class="sheet-hd">
    <button class="t1" id="fCancel">取消</button>
    <strong id="fTitle">新增車輛</strong>
    <button class="t2" id="fSave">儲存</button>
  </header>
  <div class="sheet-body" id="fBody"></div>
  <footer class="sheet-ft">
    <div>籌碼<b id="fChips">0</b></div>
    <div>支出<b id="fOuts">0</b></div>
    <div class="big" id="fDiffWrap">差異<b id="fDiff">0</b></div>
  </footer>
</div>

<div class="sheet" id="dataSheet" hidden>
  <header class="sheet-hd">
    <button class="t1" id="dClose">關閉</button>
    <strong>資料管理</strong>
    <span style="width:52px"></span>
  </header>
  <div class="sheet-body">
    <div class="grp">
      <div class="grp-hd"><span>跨裝置同步</span></div>
      <div class="grp-bd" style="padding:12px 14px">
        <p class="note" style="padding:0 0 10px">資料只存在這台裝置的瀏覽器裡。要搬到另一支手機或電腦，用下面的同步連結或雲端同步。</p>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <button class="btn" style="flex:1" id="btnLink">產生同步連結</button>
          <button class="btn" style="flex:1" id="btnPaste">貼上連結匯入</button>
        </div>
        <div id="linkBox" class="hide" style="margin-top:10px">
          <textarea id="linkOut" readonly style="width:100%;height:74px;border:1px solid var(--line);border-radius:9px;padding:8px;font-size:11px;background:#FDFCFA;color:var(--ink2);resize:none" spellcheck="false"></textarea>
          <div style="display:flex;gap:8px;margin-top:8px">
            <button class="btn" style="flex:1" id="btnCopyLink">複製</button>
            <button class="btn" style="flex:1" id="btnShareLink">分享</button>
          </div>
        </div>
      </div>
    </div>
    <div class="grp">
      <div class="grp-hd"><span>雲端同步（Google 試算表）</span></div>
      <div class="grp-bd" style="padding:12px 14px">
        <input class="txt" id="syncUrl" placeholder="貼上 Apps Script 網址（/exec 結尾）" style="width:100%;height:37px;border:1px solid var(--line);border-radius:9px;padding:0 9px;font-size:12px;background:#FDFCFA">
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn" style="flex:1" id="btnCloudUp">立即同步</button>
          <button class="btn" style="flex:1" id="btnCloudDown">僅下載</button>
        </div>
        <div id="cloudState" class="note" style="padding:8px 0 0">尚未設定</div>
      </div>
    </div>
    <div class="grp">

<script>
window.APP_VERSION = '1.3.1';
const KEY='hondaStats.v1', SKEY='hondaStats.staff';
const MODELS=['HRV S','HRV ES','HRV EP','HRV 汽油','CRV VTIS','CRV S','CRV ES','CRV EP','FIT HOME','FIT eHEV','CIVIC','ZR-V','PRELUDE','其他'];
const STATUSES=['訂車','已配','已領','已交','其他'];
const CHIP_DEFS=[['獎金','bonus'],['SP固定','sp'],['中古車','used'],['貸款傭金','loancom'],['客人自付','selfpay'],['在庫車','stock'],['富達分期','fuda'],['新車保險','insnew'],['營業車','biz'],['高速累台','hway'],['台本累台','taiben'],['來店客','visit'],['衝刺獎金','sprint'],['代宇籌碼','daiyu'],['支援金','support']];
const OUT_DEFS=[['折價','discount'],['配備','equip'],['協和','xiehe'],['百貨','dept'],['補貼息','subsidy'],['代宇費用','daiyufee'],['領牌','plate'],['保險','ins'],['加油','fuel'],['烤漆','paint'],['介紹紅包','referral'],['贈禮','gift'],['外裝','exterior']];
const EXT_DEFS=[['業外報廢車','scrap'],['業外中古車','extused'],['業外貼膜','film'],['業外隔熱紙','tint'],['業外鍍膜','coat'],['業外其他','other']];
const CSV_COLS=['時間戳記','業務員','月份','車款','顏色規格','客戶姓名','狀態','獎金','SP固定','中古車','貸款傭金','客人自付','在庫車','富達分期','新車保險','營業車','高速累台','台本累台','來店客','衝刺獎金','代宇籌碼','支援金','自訂SP名稱','自訂SP金額','折價','配備','協和','百貨','補貼息','代宇費用','領牌','保險','加油','烤漆','介紹紅包','贈禮','外裝','自訂支出1名稱','自訂支出1金額','自訂支出2名稱','自訂支出2金額','自訂支出3名稱','自訂支出3金額','自訂支出4名稱','自訂支出4金額','自訂支出5名稱','自訂支出5金額','車體險','貸款配合','公司配件金額','業外報廢車','業外中古車','業外貼膜','業外隔熱紙','業外鍍膜','業外其他','籌碼總計','支出總計','差異','業外合計'];

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/[^\d.-]/g,''));return isFinite(n)?n:0};
const fmt=n=>{const v=Math.round(num(n));return v.toLocaleString('en-US')};
const neg=n=>num(n)<0;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nowMonth=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};

let DB={records:[]};
let flt={staff:'',month:'all'};
let editing=null;

function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(d&&Array.isArray(d.records))DB=d}}catch(e){}
  flt.staff=localStorage.getItem(SKEY)||'';
}
function save(){localStorage.setItem(KEY,JSON.stringify(DB));localStorage.setItem(KEY+'.at',String(Date.now()));if(typeof schedulePush==='function')schedulePush()}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1900)}

function calc(r){
  let chips=0;CHIP_DEFS.forEach(([l,k])=>chips+=num(r.chips&&r.chips[k]));
  chips+=num(r.csp);
  let outs=0;OUT_DEFS.forEach(([l,k])=>outs+=num(r.outs&&r.outs[k]));
  (r.cust||[]).forEach(c=>outs+=num(c&&c.a));
  let ext=0;EXT_DEFS.forEach(([l,k])=>ext+=num(r.ext&&r.ext[k]));
  return {chips,outs,diff:chips-outs,ext};
}
function staffList(){return [...new Set(DB.records.map(r=>r.staff).filter(Boolean))].sort()}
function monthsOf(list){return [...new Set(list.map(r=>r.month).filter(Boolean))].sort().reverse()}
function filtered(){
  return DB.records.filter(r=>!r.del&&(!flt.staff||r.staff===flt.staff)&&(flt.month==='all'||r.month===flt.month))
    .sort((a,b)=>(b.ts||0)-(a.ts||0));
}

/* ---------- header ---------- */
function renderStaffDL(){const dl=$('#staffList');dl.innerHTML=staffList().map(s=>`<option value="${esc(s)}">`).join('')}
function renderMonthSel(){
  const base=DB.records.filter(r=>!flt.staff||r.staff===flt.staff);
  const ms=monthsOf(base);
  const cur=flt.month;
  const opts=['<option value="all">全部月份</option>'].concat(ms.map(m=>{
    const [y,mo]=m.split('-');
    return `<option value="${m}">${y} 年 ${+mo} 月</option>`;}));
  const sel=$('#month');
  sel.innerHTML=opts.join('');
  sel.value=(cur==='all'||ms.includes(cur))?cur:'all';
  flt.month=sel.value;
  if(cur!=='all'&&!ms.includes(cur)&&!DB.records.length){}
}

/* ---------- list ---------- */
function row(label,val,cls){return `<div class="kv"><dt>${esc(label)}</dt><dd class="${cls||''}">${fmt(val)}</dd></div>`}
const EXTRA_CHIPS=[['新車保險','insnew'],['高速累台','hway'],['台本累台','taiben'],['來店客','visit'],['衝刺獎金','sprint'],['代宇籌碼','daiyu'],['支援金','support']];
function recCard(r){
  const c=calc(r);
  const parts=[r.customer,r.color,r.month?(r.month.split('-')[0]+'/'+r.month.split('-')[1]):''].filter(Boolean);
  let chipDetail='',outDetail='';
  CHIP_DEFS.forEach(([l,k])=>{if(num(r.chips&&r.chips[k]))chipDetail+=row(l,r.chips[k],'b')});
  if(num(r.csp))chipDetail+=row('自訂SP'+(r.cspName?'（'+r.cspName+'）':''),r.csp,'b');
  let addOn=0;EXTRA_CHIPS.forEach(([l,k])=>{addOn+=num(r.chips&&r.chips[k])});
  const sub=addOn?`<div class="subrow"><span>加碼小計</span><b>${fmt(addOn)}</b></div><div class="subnote">新車保險・高速累台・台本累台・來店客・衝刺・代宇・支援金</div>`:'';
  OUT_DEFS.forEach(([l,k])=>{if(num(r.outs&&r.outs[k]))outDetail+=row(l,r.outs[k],'r')});
  (r.cust||[]).forEach(cc=>{if(num(cc&&cc.a))outDetail+=row(cc.n||'自訂支出',cc.a,'r')});
  let extra='';
  if(num(r.acc))extra+=row('公司配件金額（參考）',r.acc);
  const flags=[r.flags&&r.flags.loan?'<span class="tag loan">貸款</span>':'',r.flags&&r.flags.body?'<span class="tag ins">車體險</span>':''].filter(Boolean).join('');
  let ext='';
  EXT_DEFS.forEach(([l,k])=>{if(num(r.ext&&r.ext[k]))ext+=row(l,r.ext[k])});
  return `<article class="rec" data-id="${r.id}">
    <div class="rec-hd">
      <div><div class="rec-model">${esc(r.model||'未指定車款')}${flags?`<span class="tags">${flags}</span>`:''}</div>
      <div class="rec-sub">${parts.map((p,i)=>`${i?'<i>·</i>':''}<span>${esc(p)}</span>`).join('')||'<span style="color:var(--ink3)">無客戶資料</span>'}</div></div>
      <span class="pill" data-s="${esc(r.status||'')}">${esc(r.status||'—')}</span>
    </div>
    <div class="rec-nums">
      <div><span class="n-hd">籌碼</span><span class="n-v bonus">${fmt(c.chips)}</span></div>
      <div><span class="n-hd">支出</span><span class="n-v spend">${fmt(c.outs)}</span></div>
      <div><span class="n-hd">差異</span><span class="n-v ${c.diff<0?'neg':(c.diff>0?'pos':'')}">${fmt(c.diff)}</span></div>
    </div>
    <div class="rec-tail">
      <span class="t">${c.ext?('業外 '+fmt(c.ext)):'&nbsp;'}</span>
      <button class="tgl" data-act="tgl">明細<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <div class="rec-body">
      <div class="dhead chip">籌碼明細</div>
      <dl style="margin:0">${chipDetail||'<div class="kv"><dt style="color:var(--ink3)">未填寫</dt><dd></dd></div>'}</dl>
      ${sub}
      <div class="dhead out">支出明細</div>
      <dl style="margin:0">${outDetail||'<div class="kv"><dt style="color:var(--ink3)">未填寫</dt><dd></dd></div>'}</dl>
      ${extra?`<dl style="margin:6px 0 0;padding-top:6px;border-top:1px dashed var(--line2)">${extra}</dl>`:''}
      ${ext?`<dl style="margin:6px 0 0;padding-top:6px;border-top:1px dashed var(--line2)"><div class="kv"><dt style="font-weight:700;color:var(--ink)">業外</dt><dd></dd></div>${ext}</dl>`:''}
      <div class="rec-acts">
        <button data-act="edit">編輯</button>
        <button class="del" data-act="del">刪除</button>
      </div>
    </div>
  </article>`;
}
function renderList(){
  const list=filtered();
  const t=list.reduce((a,r)=>{const c=calc(r);a.chips+=c.chips;a.outs+=c.outs;a.ext+=c.ext;return a},{chips:0,outs:0,ext:0});
  $('#listMeta').innerHTML=list.length
    ? `共 <b>${list.length}</b> 台　淨額 <b style="color:${t.chips-t.outs<0?'var(--red)':'var(--green)'}">${fmt(t.chips-t.outs)}</b>`
    : '尚無紀錄';
  const el=$('#list');
  if(!list.length){
    el.innerHTML=`<div class="empty">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M3 17h2m14 0h2"/><path d="M5 17V9l2-4h10l2 4v8"/><circle cx="8" cy="17" r="1.6"/><circle cx="16" cy="17" r="1.6"/></svg></div>
      <h3>還沒有任何車輛</h3>
      <p>登錄一台車就會自動算出籌碼、支出與差異。<br>已經有 Google 試算表的資料，可直接匯入。</p>
      <div class="row2"><button class="btn" id="eImp">匯入 Google 試算表 CSV</button></div>
    </div>`;
    $('#eImp').onclick=()=>$('#fileCsv').click();
    return;
  }
  el.innerHTML=list.map(recCard).join('');
}

/* ---------- summary ---------- */
function renderSummary(){
  const list=filtered();
  const agg={n:list.length,chips:0,outs:0,diff:0,ext:0,loan:0,body:0};
  const byModel={},byStatus={},byMonth={};
  list.forEach(r=>{
    const c=calc(r);
    agg.chips+=c.chips;agg.outs+=c.outs;agg.diff+=c.diff;agg.ext+=c.ext;
    if(r.flags&&r.flags.loan)agg.loan++;
    if(r.flags&&r.flags.body)agg.body++;
    const m=r.model||'未指定';
    byModel[m]=byModel[m]||{n:0,diff:0};byModel[m].n++;byModel[m].diff+=c.diff;
    const s=r.status||'—';
    byStatus[s]=byStatus[s]||{n:0,diff:0};byStatus[s].n++;byStatus[s].diff+=c.diff;
    const mo=r.month||'—';
    byMonth[mo]=byMonth[mo]||{n:0,diff:0,chips:0};byMonth[mo].n++;byMonth[mo].diff+=c.diff;byMonth[mo].chips+=c.chips;
  });
  const avg=agg.n?agg.diff/agg.n:0;
  $('#kpis').innerHTML=`
    <div class="kpi"><span>成交台數</span><b>${agg.n}<span style="font-size:12px;color:var(--ink3);font-weight:600"> 台</span></b></div>
    <div class="kpi"><span>平均每台淨額</span><b class="${avg<0?'neg':(avg>0?'pos':'')}">${fmt(avg)}</b></div>
    <div class="kpi"><span>籌碼總計</span><b>${fmt(agg.chips)}</b></div>
    <div class="kpi"><span>支出總計</span><b>${fmt(agg.outs)}</b></div>
    <div class="kpi wide">
      <div><span>淨額（籌碼－支出）</span><b class="${agg.diff<0?'neg':(agg.diff>0?'pos':'')}" style="font-size:23px">${fmt(agg.diff)}</b></div>
      <div class="sub">業外合計<br><b style="font-size:15px;color:var(--ink)">${fmt(agg.ext)}</b></div>
    </div>
    <div class="kpi"><span>貸款配合比例</span><b style="color:var(--blue)">${agg.n?((agg.loan/agg.n*100).toFixed(1)):0}<span style="font-size:12px;color:var(--ink3);font-weight:600"> %</span></b><span style="margin:2px 0 0;font-size:10.5px;color:var(--ink3)">${agg.loan} / ${agg.n} 台</span></div>
    <div class="kpi"><span>車體險比例</span><b style="color:var(--green)">${agg.n?((agg.body/agg.n*100).toFixed(1)):0}<span style="font-size:12px;color:var(--ink3);font-weight:600"> %</span></b><span style="margin:2px 0 0;font-size:10.5px;color:var(--ink3)">${agg.body} / ${agg.n} 台</span></div>`;

function download(name,text,type){

  a.href=URL.createObjectURL(blob);a.download=name;a.click();

function toCsv(){
  const esc2=v=>{const s=String(v==null?'':v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const lines=[CSV_COLS.join(',')];
  filtered().forEach(r=>{
    const c=calc(r);
    const row=[r.ts||'',r.staff||'',r.month||'',r.model||'',r.color||'',r.customer||'',r.status||''];
    CHIP_DEFS.forEach(([l,k])=>row.push(num(r.chips&&r.chips[k])||''));
    row.push(r.cspName||'',num(r.csp)||'');
    OUT_DEFS.forEach(([l,k])=>row.push(num(r.outs&&r.outs[k])||''));
    for(let i=0;i<5;i++){const cc=(r.cust||[])[i]||{};row.push(cc.n||'',num(cc.a)||'')}
    row.push(r.flags&&r.flags.body?1:'',r.flags&&r.flags.loan?1:'',num(r.acc)||'');
    EXT_DEFS.forEach(([l,k])=>row.push(num(r.ext&&r.ext[k])||''));
    row.push(c.chips,c.outs,c.diff,c.ext);
    lines.push(row.map(esc2).join(','));
  });
  return '\ufeff'+lines.join('\r\n');
}
function parseCsv(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++} else q=false }
      else cur+=ch;
    }else{
      if(ch==='"')q=true;
      else if(ch===','){row.push(cur);cur=''}
      else if(ch==="\n"){row.push(cur);rows.push(row);row=[];cur=''}
      else if(ch==="\r"){}
      else cur+=ch;
    }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows;
}
function normMonth(v){
  if(v==null||v==='')return '';
  if(typeof v==='number'){
    const d=new Date(Math.round((v-25569)*86400*1000));
    return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0');
  }
  const s=String(v).trim();
  let m=s.match(/^(\d{4})[-/](\d{1,2})/);
  if(m)return m[1]+'-'+String(+m[2]).padStart(2,'0');
  m=s.match(/^(\d{4})[年](\d{1,2})/);
  if(m)return m[1]+'-'+String(+m[2]).padStart(2,'0');
  const d=new Date(s);
  if(!isNaN(d))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  return '';
}
function importCsv(text){
  const rows=parseCsv(text.replace(/^\ufeff/,''));
  if(!rows.length){toast('檔案是空的');return}
  const hdr=rows[0].map(h=>String(h).trim());
  const idx={};hdr.forEach((h,i)=>idx[h]=i);
  if(idx['車款']==null&&idx['業務員']==null){toast('欄位不符，請用原始 CSV');return}
  const seen=new Set(DB.records.map(r=>String(r.ts||'')));
  let added=0,skip=0;
  const get=(r,name)=>idx[name]!=null?r[idx[name]]:undefined;
  rows.slice(1).forEach(r=>{
    if(!r||!String(r.join('')).trim())return;
    const staff=String(get(r,'業務員')||'').trim();
    if(!staff)return;
    const tsRaw=get(r,'時間戳記');
    const ts=num(tsRaw)||Date.now();
    if(seen.has(String(ts))){skip++;return}
    seen.add(String(ts));
    const rec={id:uid(),ts,staff,month:normMonth(get(r,'月份')),model:String(get(r,'車款')||'').trim(),
      color:String(get(r,'顏色規格')||'').trim(),customer:String(get(r,'客戶姓名')||'').trim(),
      status:String(get(r,'狀態')||'').trim()||'訂車',chips:{},outs:{},ext:{},cust:[],flags:{},csp:0,cspName:''};
    CHIP_DEFS.forEach(([l,k])=>{rec.chips[k]=num(get(r,l))});
    rec.cspName=String(get(r,'自訂SP名稱')||'').trim();
    rec.csp=num(get(r,'自訂SP金額'));
    OUT_DEFS.forEach(([l,k])=>{rec.outs[k]=num(get(r,l))});
    for(let i=0;i<5;i++){
      const n=String(get(r,`自訂支出${i+1}名稱`)||'').trim();
      const a=num(get(r,`自訂支出${i+1}金額`));
      if(n||a)rec.cust[i]={n,a};else rec.cust[i]={n:'',a:0};
    }
    rec.flags={body:num(get(r,'車體險'))?1:0,loan:num(get(r,'貸款配合'))?1:0};
    rec.acc=num(get(r,'公司配件金額'));
    EXT_DEFS.forEach(([l,k])=>{rec.ext[k]=num(get(r,l))});
    DB.records.push(rec);added++;
  });
  save();renderStaffDL();renderMonthSel();renderList();renderSummary();
  toast(added?`已匯入 ${added} 筆${skip?'（略過 '+skip+' 筆重複）':''}`:'沒有新資料');
}
function importJson(text){
  try{
    const d=JSON.parse(text);
    const recs=Array.isArray(d)?d:(d.records||[]);
    if(!Array.isArray(recs)||!recs.length){toast('備份檔沒有資料');return}
    const seen=new Set(DB.records.map(r=>String(r.ts||'')+r.model+r.customer));
    let added=0;
    recs.forEach(r=>{
      const k=String(r.ts||'')+r.model+r.customer;
      if(seen.has(k))return;
      seen.add(k);
      r.id=r.id||uid();r.ts=r.ts||Date.now();
      DB.records.push(r);added++;
    });
    save();renderStaffDL();renderMonthSel();renderList();renderSummary();
    toast(added?`已還原 ${added} 筆`:'資料已存在');
  }catch(e){toast('備份檔格式錯誤')}
}

/* ---------- 跨裝置同步 ---------- */
const SYNCURL_KEY='hondaStats.syncUrl';
let pushTimer=null;

function encodeRecords(recs){
  try{return LZString.compressToEncodedURIComponent(JSON.stringify({v:1,t:Date.now(),records:recs}))}
  catch(e){return ''}
}
function decodeRecords(str){
  try{
    const d=JSON.parse(LZString.decompressFromEncodedURIComponent(str)||'null');
    if(!d)return null;
    return Array.isArray(d)?d:(d.records||null);
  }catch(e){return null}
}
function mergeRecords(incoming,srcLabel){
  if(!Array.isArray(incoming)||!incoming.length){toast('沒有可匯入的資料');return 0}
  const idx={};
  DB.records.forEach(r=>{idx[r.id||('ts'+r.ts)]=r});
  let added=0,updated=0;
  incoming.forEach(r=>{
    if(!r||typeof r!=='object')return;
    r.id=r.id||('ts'+(r.ts||Date.now()));
    r.chips=r.chips||{};r.outs=r.outs||{};r.ext=r.ext||{};r.cust=r.cust||[];r.flags=r.flags||{};
    const cur=idx[r.id];
    if(!cur){DB.records.push(r);idx[r.id]=r;added++}
    else if((r.upd||0)>(cur.upd||0)){Object.assign(cur,r);updated++}
  });
  save();renderStaffDL();renderMonthSel();renderList();renderSummary();
  if(added||updated)toast((srcLabel?srcLabel+' ':'')+'新增 '+added+'、更新 '+updated+' 筆');
  else toast('資料已是最新');
  return added+updated;
}
function syncLink(){
  const recs=(flt.staff||flt.month!=='all')?filtered():DB.records;
  return location.origin+location.pathname+'#d='+encodeRecords(recs);
}
function applyHash(){
  const h=location.hash||'';
  if(h.indexOf('#d=')!==0)return false;
  const recs=decodeRecords(h.slice(3));
  if(recs&&recs.length){
    mergeRecords(recs,'連結匯入');
    try{history.replaceState(null,'',location.pathname+location.search)}catch(e){location.hash=''}
    return true;
  }
  return false;
}
/* --- 雲端：Google Apps Script --- */
function syncUrl(){return (localStorage.getItem(SYNCURL_KEY)||'').trim()}
function setCloudState(msg){const el=$('#cloudState');if(el)el.textContent=msg}
function jsonp(url,timeout){
  return new Promise((resolve,reject)=>{
    const cb='cbsync'+Math.random().toString(36).slice(2,10);
    const el=document.createElement('script');
    let done=false;
    const cleanup=()=>{try{delete window[cb]}catch(e){window[cb]=undefined}el.remove()};
    window[cb]=d=>{if(done)return;done=true;cleanup();resolve(d)};
    el.onerror=()=>{if(done)return;done=true;cleanup();reject(new Error('連線失敗'))};
    el.src=url+(url.indexOf('?')>=0?'&':'?')+'action=load&callback='+cb+'&_='+Date.now();
    document.head.appendChild(el);
    setTimeout(()=>{if(done)return;done=true;cleanup();reject(new Error('逾時'))},timeout||15000);
  });
}
async function cloudDownload(){
  const url=syncUrl();
  if(!url){toast('請先貼上雲端網址');return 0}
  setCloudState('下載中…');
  try{
    const res=await jsonp(url);
    const data=res&&(res.data!==undefined?res.data:res);
    let recs=null;
    if(typeof data==='string')recs=decodeRecords(data);
    else if(Array.isArray(data))recs=data;
    else if(data&&Array.isArray(data.records))recs=data.records;
    if(!recs||!recs.length){setCloudState('雲端尚無資料　'+clock());return 0}
    const n=mergeRecords(recs,'雲端');
    setCloudState('下載 '+recs.length+' 筆／合併 '+n+' 筆　'+clock());
    return recs.length;
  }catch(e){setCloudState('下載失敗：'+(e.message||'未知錯誤'));return 0}
}
async function cloudUpload(silent){
  const url=syncUrl();
  if(!url){if(!silent)toast('請先貼上雲端網址');return false}
  try{
    await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'push',records:DB.records.filter(function(r){return !r.del||r.upd}),updatedAt:Date.now()})});
    setCloudState('已上傳 '+DB.records.length+' 筆　'+clock());
    if(!silent)toast('已上傳雲端');
    return true;
  }catch(e){setCloudState('上傳失敗：'+(e.message||'未知錯誤'));if(!silent)toast('上傳失敗');return false}
}
async function cloudSync(){
  await cloudDownload();
  await cloudUpload(true);
}
function clock(){const d=new Date();return d.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}
function schedulePush(){
  if(!syncUrl())return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{cloudSync()},3500);
}

      if(e.target.closest('.rec-body'))return;
      card.classList.toggle('open');return;
    }
    if(act.dataset.act==='tgl')card.classList.toggle('open');
    else if(act.dataset.act==='edit')openForm(r);
    else if(act.dataset.act==='del'){
      if(confirm('刪除「'+r.model+(r.customer?' '+r.customer:'')+'」這筆紀錄？')){
        r.del=1;r.upd=Date.now();
        save();renderMonthSel();renderList();renderSummary();toast('已刪除');
      }
    }
  });
  $('#fCancel').onclick=closeForm;
  $('#fSave').onclick=saveForm;

  const openData=()=>{$('#dataSheet').hidden=false;document.body.style.overflow='hidden'};
  const closeData=()=>{$('#dataSheet').hidden=true;document.body.style.overflow=''};
  $('#btnData').onclick=openData;
  $('#dClose').onclick=closeData;
  $('#btnImpCsv').onclick=()=>$('#fileCsv').click();
  $('#btnImpJson').onclick=()=>$('#fileJson').click();
  $('#fileCsv').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{importCsv(rd.result);closeData()};
    rd.readAsText(f,'utf-8');e.target.value='';
  };
  $('#fileJson').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{importJson(rd.result);closeData()};
    rd.readAsText(f,'utf-8');e.target.value='';
  };
  $('#btnExpCsv').onclick=()=>{
    const nm='獎金統計_'+(flt.staff||'全部')+'_'+(flt.month==='all'?'全部月份':flt.month)+'.csv';
    download(nm,toCsv(),'text/csv;charset=utf-8');
  };
  $('#btnExpJson').onclick=()=>{
    download('獎金統計備份_'+new Date().toISOString().slice(0,10)+'.json',
      JSON.stringify({v:1,exportedAt:new Date().toISOString(),records:DB.records},null,1),'application/json');
  };
  $('#btnClear').onclick=()=>{
    if(confirm('清除這台裝置上的全部紀錄？無法復原，建議先匯出備份。')){
      DB={records:[]};save();renderStaffDL();renderMonthSel();renderList();renderSummary();
      closeData();toast('已清除');
    }
  };
  $('#verChip').onclick=async()=>{
    if(!confirm('重新載入並清除快取？\n（已登錄的紀錄不會消失）'))return;
    try{
      const rs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(r=>r.unregister()));
      if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}
    }catch(err){}
    location.reload();
  };

  /* ---- 同步 ---- */
  const urlEl=$('#syncUrl');
  if(urlEl){urlEl.value=syncUrl()}
  setCloudState(syncUrl()?'已設定雲端網址':'尚未設定');
  if(urlEl)urlEl.addEventListener('change',()=>{
    localStorage.setItem(SYNCURL_KEY,urlEl.value.trim());
    setCloudState(urlEl.value.trim()?'已設定，可按「立即同步」':'尚未設定');
  });
  const showLink=()=>{
    const a=syncLink();
    $('#linkOut').value=a;
    $('#linkBox').classList.remove('hide');
    return a;
  };
  $('#btnLink').onclick=showLink;
  $('#btnCopyLink').onclick=async()=>{
    const a=$('#linkOut').value||showLink();
    try{await navigator.clipboard.writeText(a);toast('已複製，貼到 LINE 傳給自己')}
    catch(e){$('#linkOut').select();toast('請長按連結複製')}
  };
  $('#btnShareLink').onclick=async()=>{
    const a=$('#linkOut').value||showLink();
    if(navigator.share){
      try{await navigator.share({title:'獎金統計 資料同步',text:'點開匯入獎金統計資料',url:a})}catch(e){}
    }else{try{await navigator.clipboard.writeText(a);toast('已複製連結')}catch(e){toast('請長按複製')}}
  };
  $('#btnPaste').onclick=async()=>{
    let txt='';
    try{txt=await navigator.clipboard.readText()}catch(e){}
    if(!txt)txt=prompt('貼上同步連結：')||'';
    const i=txt.indexOf('#d=');
    if(i<0){toast('這不是同步連結');return}
    const recs=decodeRecords(txt.slice(i+3).trim());
    if(!recs){toast('連結已損毀，請重新產生');return}
    mergeRecords(recs,'連結匯入');
    $('#linkBox').classList.add('hide');
  };
  $('#btnCloudUp').onclick=()=>{if(!syncUrl()){toast('請先貼上雲端網址');return}cloudSync()};
  $('#btnCloudDown').onclick=()=>{if(!syncUrl()){toast('請先貼上雲端網址');return}cloudDownload()};

  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
document.addEventListener('DOMContentLoaded',init);

</script>
</body>
</html>
